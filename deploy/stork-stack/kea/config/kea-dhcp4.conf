{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": ["*"],
      "service-sockets-max-retries": 10,
      "service-sockets-retry-wait-time": 3000
    },

    "control-sockets": [
      {
        "socket-type": "unix",
        "socket-name": "kea4-ctrl-socket"
      },
      {
        "socket-type": "http",
        "socket-address": "127.0.0.1",
        "socket-port": 8000
      }
    ],

    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },

    "hooks-libraries": [
      { "library": "libdhcp_lease_cmds.so" },
      { "library": "libdhcp_stat_cmds.so" },
      { "library": "libdhcp_subnet_cmds.so" }
    ],

    "renew-timer": 900,
    "rebind-timer": 1800,
    "valid-lifetime": 3600,

    "subnet4": [
      {
        "id": 1,
        "subnet": "172.42.0.0/24",
        "pools": [
          { "pool": "172.42.0.100 - 172.42.0.250" }
        ],
        "option-data": [
          { "name": "routers", "data": "172.42.0.1" },
          { "name": "domain-name-servers", "data": "1.1.1.1, 8.8.8.8" }
        ]
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [
          { "output": "stdout", "pattern": "%-5p %m\n" }
        ],
        "severity": "INFO"
      }
    ]
  }
}
